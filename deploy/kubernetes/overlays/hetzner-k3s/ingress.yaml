apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: camp-api
  annotations:
    cert-manager.io/cluster-issuer: REPLACE_WITH_YOUR_ISSUER
spec:
  ingressClassName: traefik
  tls:
    - hosts: [camp.example.invalid]
      secretName: camp-api-tls
  rules:
    - host: camp.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: camp-api
                port:
                  name: http
