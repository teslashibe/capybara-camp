apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-postgres
spec:
  podSelector:
    matchLabels:
      app: camp-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: camp-api
        - podSelector:
            matchLabels:
              app: camp-migrate
        - podSelector:
            matchLabels:
              app: camp-controller
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels:
      app: camp-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8096
