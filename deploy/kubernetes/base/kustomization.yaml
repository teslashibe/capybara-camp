apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: capybara-camp
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - migrate.yaml
  - network.yaml
configMapGenerator:
  - name: camp-config
    literals:
      - CAMP_ADDRESS=0.0.0.0:8096
      - CAMP_PUBLIC_URL=https://camp.example.invalid
      - CAMP_EMAIL_FROM=Camp <camp@example.invalid>
images:
  - name: camp-server
    newName: ghcr.io/teslashibe/capybara-camp
    newTag: REPLACE_WITH_TESTED_VERSION
