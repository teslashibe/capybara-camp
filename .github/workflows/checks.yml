name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test fixture-only adapters and native state
        run: ./test.sh
      - name: Build universal macOS app
        run: ./build.sh --universal
      - name: Verify app signature and version
        run: |
          codesign --verify --strict "build/Capybara Camp.app"
          python3 -c 'import pathlib, plistlib; p=plistlib.loads(pathlib.Path("build/Capybara Camp.app/Contents/Info.plist").read_bytes()); assert p["CFBundleShortVersionString"] == pathlib.Path("VERSION").read_text().strip()'
