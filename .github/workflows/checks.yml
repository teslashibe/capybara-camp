name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test fixture-only adapters and native state
        run: ./test.sh
      - name: Build universal macOS app
        run: ./build.sh --universal
      - name: Verify app signature and version
        run: |
          codesign --verify --strict "build/Capybara Camp.app"
          codesign --verify --strict "build/Capybara Camp.app/Contents/MacOS/camp-local"
          test "$(plutil -extract CFBundleShortVersionString raw 'build/Capybara Camp.app/Contents/Info.plist')" = "$(cat VERSION)"
